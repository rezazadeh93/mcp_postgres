services:
  postgres:
    image: postgres:16-alpine
    container_name: hermes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes_db
    command: postgres -c shared_buffers=64MB
    volumes:
      - hermes_pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.75
    networks:
      - hermes_net

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes_mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermes_db
      MCP_TRANSPORT: streamable-http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8765"
      FASTMCP_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.75
    networks:
      - hermes_net

volumes:
  hermes_pg_data:

networks:
  hermes_net:
    driver: bridge
